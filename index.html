<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Phòng Học Hình Học Không Gian 12</title>
  
  <!-- Import model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- Import Three.js core -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
      }
    }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      --poster-color: transparent;
      --progress-bar-color: #38bdf8;
    }

    /* Menu chọn khối hình */
    #menu-chon {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
      width: 95%;
      max-width: 900px;
      overflow-x: auto;
      padding: 8px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      -webkit-overflow-scrolling: touch;
    }

    .btn-hinh {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .btn-hinh:hover {
      background: rgba(56, 189, 248, 0.3);
      color: white;
    }

    .btn-hinh.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.5);
    }

    /* Trạng thái */
    #trang-thai {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      z-index: 110;
      padding: 6px 16px;
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Nút AR */
    #ar-button {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #fbbf24;
      color: #0f172a;
      border: none;
      border-radius: 30px;
      padding: 14px 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.5);
      z-index: 100;
      transition: all 0.3s;
    }

    #ar-button:hover {
      background: #fcd34d;
      transform: translateX(-50%) scale(1.05);
    }

    @media (max-width: 600px) {
      .btn-hinh {
        padding: 6px 10px;
        font-size: 11px;
      }
      #ar-button {
        padding: 12px 20px;
        font-size: 14px;
        bottom: 15px;
      }
      #trang-thai {
        top: 60px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Menu chọn hình -->
  <div id="menu-chon">
    <button class="btn-hinh active" onclick="chonMoHinh('tudien', this)">Tứ diện đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('choptugiac', this)">Chóp tứ giác</button>
    <button class="btn-hinh" onclick="chonMoHinh('langtru', this)">Lăng trụ</button>
    <button class="btn-hinh" onclick="chonMoHinh('tru', this)">Hình trụ</button>
    <button class="btn-hinh" onclick="chonMoHinh('matcau', this)">Mặt cầu</button>
    <button class="btn-hinh" onclick="chonMoHinh('lapphuong', this)">Lập phương</button>
    <button class="btn-hinh" onclick="chonMoHinh('hopchunhat', this)">Hộp chữ nhật</button>
    <button class="btn-hinh" onclick="chonMoHinh('non', this)">Hình nón</button>
    <button class="btn-hinh" onclick="chonMoHinh('batdien', this)">Bát diện</button>
    <button class="btn-hinh" onclick="chonMoHinh('muoihimat', this)">12 mặt</button>
    <button class="btn-hinh" onclick="chonMoHinh('haimuoimat', this)">20 mặt</button>
  </div>

  <div id="trang-thai">Đang tải mô hình...</div>

  <!-- Model viewer -->
  <model-viewer 
    id="viewer"
    camera-controls 
    touch-action="pan-y" 
    auto-rotate 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    shadow-intensity="1"
    exposure="1.2">
    
    <button slot="ar-button" id="ar-button">
      📷 XEM TRONG KHÔNG GIAN THỰC (AR)
    </button>
  </model-viewer>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    
    const exporter = new GLTFExporter();
    const viewer = document.getElementById('viewer');
    const trangThai = document.getElementById('trang-thai');
    const cacMoHinh = {};

    // Bảng màu
    const bangMau = [
      0xf87171, 0x60a5fa, 0x4ade80, 0xfacc15, 0xfb923c,
      0xc084fc, 0x2dd4bf, 0xf472b6, 0xa78bfa, 0x38bdf8,
      0xfb7185, 0xa3e635, 0xe879f9, 0x34d399, 0xfde047,
      0x818cf8, 0xf43f5e, 0x10b981, 0x06b6d4, 0xd946ef
    ];

    // Hàm tạo vật liệu
    function taoVatLieu(mau, doTrongSuot = 0.85) {
      return new THREE.MeshPhongMaterial({
        color: mau,
        opacity: doTrongSuot,
        transparent: true,
        shininess: 30,
        side: THREE.DoubleSide
      });
    }

    // Hàm tạo mặt tam giác
    function taoMatTamGiac(p1, p2, p3, vatLieu) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, vatLieu);
    }

    // Hàm tạo mặt tứ giác
    function taoMatTuGiac(p1, p2, p3, p4, vatLieu) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z,
        p3.x, p3.y, p3.z,
        p4.x, p4.y, p4.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, vatLieu);
    }

    // Hàm tạo mặt ngũ giác
    function taoMatNguGiac(p1, p2, p3, p4, p5, vatLieu) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z,
        p3.x, p3.y, p3.z,
        p4.x, p4.y, p4.z,
        p1.x, p1.y, p1.z,
        p4.x, p4.y, p4.z,
        p5.x, p5.y, p5.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, vatLieu);
    }

    // Hàm thêm cạnh
    function themCanh(scene, diem1, diem2) {
      const geometry = new THREE.BufferGeometry().setFromPoints([diem1, diem2]);
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 2 }));
      scene.add(line);
    }

    // Hàm tạo các mô hình
    function taoTatCaMoHinh() {
      const danhSach = [];

      // 1. Tứ diện đều
      const scene1 = new THREE.Scene();
      const A = new THREE.Vector3(0, 0.8, 0);
      const B = new THREE.Vector3(0, 0, 0.6);
      const C = new THREE.Vector3(-0.5, 0, -0.3);
      const D = new THREE.Vector3(0.5, 0, -0.3);
      scene1.add(taoMatTamGiac(B, C, D, taoVatLieu(bangMau[0])));
      scene1.add(taoMatTamGiac(A, B, C, taoVatLieu(bangMau[1])));
      scene1.add(taoMatTamGiac(A, C, D, taoVatLieu(bangMau[2])));
      scene1.add(taoMatTamGiac(A, D, B, taoVatLieu(bangMau[3])));
      themCanh(scene1, A, B); themCanh(scene1, A, C); themCanh(scene1, A, D);
      themCanh(scene1, B, C); themCanh(scene1, C, D); themCanh(scene1, D, B);
      danhSach.push({ id: 'tudien', scene: scene1 });

      // 2. Chóp tứ giác đều
      const scene2 = new THREE.Scene();
      const S = new THREE.Vector3(0, 0.8, 0);
      const A2 = new THREE.Vector3(-0.4, 0, 0.4);
      const B2 = new THREE.Vector3(0.4, 0, 0.4);
      const C2 = new THREE.Vector3(0.4, 0, -0.4);
      const D2 = new THREE.Vector3(-0.4, 0, -0.4);
      scene2.add(taoMatTuGiac(A2, B2, C2, D2, taoVatLieu(bangMau[4])));
      scene2.add(taoMatTamGiac(S, A2, B2, taoVatLieu(bangMau[5])));
      scene2.add(taoMatTamGiac(S, B2, C2, taoVatLieu(bangMau[6])));
      scene2.add(taoMatTamGiac(S, C2, D2, taoVatLieu(bangMau[7])));
      scene2.add(taoMatTamGiac(S, D2, A2, taoVatLieu(bangMau[8])));
      themCanh(scene2, S, A2); themCanh(scene2, S, B2); themCanh(scene2, S, C2); themCanh(scene2, S, D2);
      themCanh(scene2, A2, B2); themCanh(scene2, B2, C2); themCanh(scene2, C2, D2); themCanh(scene2, D2, A2);
      danhSach.push({ id: 'choptugiac', scene: scene2 });

      // 3. Lăng trụ tam giác
      const scene3 = new THREE.Scene();
      const h = 0.7;
      const pA = new THREE.Vector3(-0.35, 0, 0.35);
      const pB = new THREE.Vector3(0.35, 0, 0.35);
      const pC = new THREE.Vector3(0, 0, -0.4);
      const pA1 = new THREE.Vector3(-0.35, h, 0.35);
      const pB1 = new THREE.Vector3(0.35, h, 0.35);
      const pC1 = new THREE.Vector3(0, h, -0.4);
      scene3.add(taoMatTamGiac(pA, pB, pC, taoVatLieu(bangMau[9])));
      scene3.add(taoMatTamGiac(pA1, pB1, pC1, taoVatLieu(bangMau[10])));
      scene3.add(taoMatTuGiac(pA, pB, pB1, pA1, taoVatLieu(bangMau[11])));
      scene3.add(taoMatTuGiac(pB, pC, pC1, pB1, taoVatLieu(bangMau[12])));
      scene3.add(taoMatTuGiac(pC, pA, pA1, pC1, taoVatLieu(bangMau[13])));
      themCanh(scene3, pA, pA1); themCanh(scene3, pB, pB1); themCanh(scene3, pC, pC1);
      themCanh(scene3, pA, pB); themCanh(scene3, pB, pC); themCanh(scene3, pC, pA);
      themCanh(scene3, pA1, pB1); themCanh(scene3, pB1, pC1); themCanh(scene3, pC1, pA1);
      danhSach.push({ id: 'langtru', scene: scene3 });

      // 4. Hình trụ
      const scene4 = new THREE.Scene();
      const truGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.7, 32);
      truGeometry.translate(0, 0.35, 0);
      scene4.add(new THREE.Mesh(truGeometry, taoVatLieu(bangMau[14], 0.8)));
      danhSach.push({ id: 'tru', scene: scene4 });

      // 5. Mặt cầu
      const scene5 = new THREE.Scene();
      const cauGeometry = new THREE.SphereGeometry(0.45, 32, 32);
      cauGeometry.translate(0, 0.45, 0);
      scene5.add(new THREE.Mesh(cauGeometry, taoVatLieu(bangMau[17], 0.6)));
      danhSach.push({ id: 'matcau', scene: scene5 });

      // 6. Hình lập phương
      const scene6 = new THREE.Scene();
      const lapPhuongGeometry = new THREE.BoxGeometry(0.65, 0.65, 0.65);
      lapPhuongGeometry.translate(0, 0.325, 0);
      scene6.add(new THREE.Mesh(lapPhuongGeometry, taoVatLieu(bangMau[18], 0.85)));
      danhSach.push({ id: 'lapphuong', scene: scene6 });

      // 7. Hình hộp chữ nhật
      const scene7 = new THREE.Scene();
      const hopGeometry = new THREE.BoxGeometry(0.75, 0.4, 0.5);
      hopGeometry.translate(0, 0.2, 0);
      scene7.add(new THREE.Mesh(hopGeometry, taoVatLieu(bangMau[19], 0.85)));
      danhSach.push({ id: 'hopchunhat', scene: scene7 });

      // 8. Hình nón
      const scene8 = new THREE.Scene();
      const nonGeometry = new THREE.ConeGeometry(0.4, 0.75, 32);
      nonGeometry.translate(0, 0.375, 0);
      scene8.add(new THREE.Mesh(nonGeometry, taoVatLieu(bangMau[12], 0.8)));
      danhSach.push({ id: 'non', scene: scene8 });

      // 9. Bát diện đều
      const scene9 = new THREE.Scene();
      const batDienGeometry = new THREE.OctahedronGeometry(0.45);
      batDienGeometry.translate(0, 0.45, 0);
      scene9.add(new THREE.Mesh(batDienGeometry, taoVatLieu(bangMau[15], 0.8)));
      danhSach.push({ id: 'batdien', scene: scene9 });

      // 10. 12 mặt đều
      const scene10 = new THREE.Scene();
      const muoiHaiMatGeometry = new THREE.DodecahedronGeometry(0.4);
      muoiHaiMatGeometry.translate(0, 0.4, 0);
      scene10.add(new THREE.Mesh(muoiHaiMatGeometry, taoVatLieu(bangMau[16], 0.8)));
      danhSach.push({ id: 'muoihimat', scene: scene10 });

      // 11. 20 mặt đều
      const scene11 = new THREE.Scene();
      const haiMuoiMatGeometry = new THREE.IcosahedronGeometry(0.42);
      haiMuoiMatGeometry.translate(0, 0.42, 0);
      scene11.add(new THREE.Mesh(haiMuoiMatGeometry, taoVatLieu(bangMau[5], 0.8)));
      danhSach.push({ id: 'haimuoimat', scene: scene11 });

      return danhSach;
    }

    // Xuất và gán mô hình
    function xuatVaGanMoHinh() {
      const danhSachMoHinh = taoTatCaMoHinh();
      
      danhSachMoHinh.forEach((item, index) => {
        try {
          exporter.parse(item.scene, function(gltf) {
            const blob = new Blob([gltf], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            cacMoHinh[item.id] = url;
            
            // Hiển thị mô hình đầu tiên
            if (index === 0) {
              viewer.src = url;
              trangThai.textContent = '✅ Đã tải xong! Xoay 3D hoặc bấm AR';
              setTimeout(() => {
                trangThai.style.opacity = '0';
              }, 3000);
            }
          }, function(error) {
            console.error('Lỗi xuất mô hình ' + item.id + ':', error);
          }, { binary: true });
        } catch (e) {
          console.error('Lỗi khi xử lý ' + item.id + ':', e);
        }
      });
    }

    // Hàm chọn mô hình (global)
    window.chonMoHinh = function(loai, btn) {
      // Cập nhật button active
      document.querySelectorAll('.btn-hinh').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      
      if (cacMoHinh[loai]) {
        viewer.src = cacMoHinh[loai];
        const tenHinh = btn ? btn.textContent.trim() : loai;
        trangThai.textContent = '🔍 ' + tenHinh;
        trangThai.style.opacity = '1';
        setTimeout(() => {
          trangThai.style.opacity = '0';
        }, 2000);
      } else {
        trangThai.textContent = '⏳ Đang tải mô hình...';
        trangThai.style.opacity = '1';
      }
    };

    // Khởi tạo
    window.addEventListener('load', () => {
      setTimeout(() => {
        xuatVaGanMoHinh();
      }, 1000);
    });

    // Xử lý lỗi
    viewer.addEventListener('error', (event) => {
      console.error('Model-viewer error:', event);
      trangThai.textContent = '⚠️ Có lỗi xảy ra, vui lòng tải lại trang';
      trangThai.style.opacity = '1';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mô Phỏng Hình Học Không Gian 3D - 11 Khối</title>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    #canvas-3d { width: 100%; height: 100%; display: block; }
    
    #menu-chon {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100; width: 95%; max-width: 960px;
      overflow-x: auto; padding: 8px; background: rgba(15, 23, 42, 0.92);
      border-radius: 25px; border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #menu-chon::-webkit-scrollbar { height: 4px; }
    #menu-chon::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    
    .btn-hinh {
      padding: 8px 14px; font-size: 13px; font-weight: bold; color: #94a3b8;
      background: transparent; border: none; border-radius: 20px; cursor: pointer;
      white-space: nowrap; transition: 0.2s; flex-shrink: 0;
    }
    .btn-hinh.active { background: #38bdf8; color: #0f172a; }
    
    #thong-bao {
      position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); color: #38bdf8; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; border: 1px solid rgba(56, 189, 248, 0.3);
      z-index: 100; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="menu-chon">
    <button class="btn-hinh active" onclick="chonMoHinh('tudien', this)">Tứ diện đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('choptugiac', this)">Chóp tứ giác đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('langtru', this)">Lăng trụ tam giác</button>
    <button class="btn-hinh" onclick="chonMoHinh('tru', this)">Hình trụ</button>
    <button class="btn-hinh" onclick="chonMoHinh('matcau', this)">Mặt cầu</button>
    <button class="btn-hinh" onclick="chonMoHinh('lapphuong', this)">Hình lập phương</button>
    <button class="btn-hinh" onclick="chonMoHinh('hopchunhat', this)">Hình hộp chữ nhật</button>
    <button class="btn-hinh" onclick="chonMoHinh('non', this)">Hình nón</button>
    <button class="btn-hinh" onclick="chonMoHinh('batdien', this)">Bát diện đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('muoihimat', this)">12 mặt đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('haimuoimat', this)">20 mặt đều</button>
  </div>

  <div id="thong-bao">🖱️ Kéo chuột để xoay hình • Cuộn chuột để phóng to/thu nhỏ</div>
  <canvas id="canvas-3d"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const canvas = document.getElementById('canvas-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.2, 1.8, 2.5);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const light = new THREE.DirectionalLight(0xffffff, 0.85);
    light.position.set(5, 10, 7);
    scene.add(light);

    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    const bangMau = [
      0xf87171, 0x60a5fa, 0x4ade80, 0xfacc15, 0xfb923c,
      0xc084fc, 0x2dd4bf, 0xf472b6, 0xa78bfa, 0x38bdf8,
      0xfb7185, 0xa3e635, 0xe879f9, 0x34d399, 0xfde047,
      0x818cf8, 0xf43f5e, 0x10b981, 0x06b6d4, 0xd946ef
    ];

    const taoVatLieu = (color) => new THREE.MeshStandardMaterial({
      color: color, opacity: 0.85, transparent: true, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide
    });

    const matVien = new THREE.LineBasicMaterial({ color: 0x020617, linewidth: 2 });
    const matDiem = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
    const matDuongCao = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });

    function taoDiem(group, pos) {
      const sp = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), matDiem);
      sp.position.copy(pos);
      group.add(sp);
    }

    function taoMatTamGiac(p1, p2, p3, mat) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z]), 3));
      g.computeVertexNormals();
      return new THREE.Mesh(g, mat);
    }

    function taoMatTuGiac(p1, p2, p3, p4, mat) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z, p3.x, p3.y, p3.z, p4.x, p4.y, p4.z
      ]), 3));
      g.computeVertexNormals();
      return new THREE.Mesh(g, mat);
    }

    function taoMatNguGiac(p1, p2, p3, p4, p5, mat) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        p1.x, p1.y, p1.z, p2.x, p2.y, p2.z, p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z, p3.x, p3.y, p3.z, p4.x, p4.y, p4.z,
        p1.x, p1.y, p1.z, p4.x, p4.y, p4.z, p5.x, p5.y, p5.z
      ]), 3));
      g.computeVertexNormals();
      return new THREE.Mesh(g, mat);
    }

    const cacMoHinh = {};

    function khoiTaoMoHinh() {
      // 1. Tứ diện đều
      const g1 = new THREE.Group();
      const vA = new THREE.Vector3(0, 0.816, 0), vB = new THREE.Vector3(0, 0, 0.577), vC = new THREE.Vector3(-0.5, 0, -0.289), vD = new THREE.Vector3(0.5, 0, -0.289), vH = new THREE.Vector3(0, 0, 0);
      g1.add(taoMatTamGiac(vB, vC, vD, taoVatLieu(bangMau[0])));
      g1.add(taoMatTamGiac(vA, vB, vC, taoVatLieu(bangMau[1])));
      g1.add(taoMatTamGiac(vA, vC, vD, taoVatLieu(bangMau[2])));
      g1.add(taoMatTamGiac(vA, vD, vB, taoVatLieu(bangMau[3])));
      const wireTD = new THREE.BufferGeometry().setFromPoints([vB, vC, vD, vA, vB, vD, vC, vA]);
      g1.add(new THREE.LineSegments(new THREE.WireframeGeometry(wireTD), matVien));
      g1.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([vA, vH]), matDuongCao));
      [vA, vB, vC, vD].forEach(p => taoDiem(g1, p));
      cacMoHinh['tudien'] = g1;

      // 2. Chóp tứ giác đều
      const g2 = new THREE.Group();
      const vS = new THREE.Vector3(0, 0.85, 0), vA2 = new THREE.Vector3(-0.4, 0, 0.4), vB2 = new THREE.Vector3(0.4, 0, 0.4), vC2 = new THREE.Vector3(0.4, 0, -0.4), vD2 = new THREE.Vector3(-0.4, 0, -0.4), vO = new THREE.Vector3(0, 0, 0);
      g2.add(taoMatTuGiac(vA2, vB2, vC2, vD2, taoVatLieu(bangMau[4])));
      g2.add(taoMatTamGiac(vS, vA2, vB2, taoVatLieu(bangMau[5])));
      g2.add(taoMatTamGiac(vS, vB2, vC2, taoVatLieu(bangMau[6])));
      g2.add(taoMatTamGiac(vS, vC2, vD2, taoVatLieu(bangMau[7])));
      g2.add(taoMatTamGiac(vS, vD2, vA2, taoVatLieu(bangMau[8])));
      const wireChop = new THREE.BufferGeometry().setFromPoints([vA2, vB2, vC2, vD2, vA2, vS, vB2, vS, vC2, vS, vD2]);
      g2.add(new THREE.LineSegments(new THREE.WireframeGeometry(wireChop), matVien));
      g2.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([vS, vO]), matDuongCao));
      [vS, vA2, vB2, vC2, vD2].forEach(p => taoDiem(g2, p));
      cacMoHinh['choptugiac'] = g2;

      // 3. Lăng trụ tam giác
      const g3 = new THREE.Group();
      const pA = new THREE.Vector3(-0.35, 0, 0.35), pB = new THREE.Vector3(0.35, 0, 0.35), pC = new THREE.Vector3(0, 0, -0.4), hLT = 0.75;
      const pA1 = new THREE.Vector3(-0.35, hLT, 0.35), pB1 = new THREE.Vector3(0.35, hLT, 0.35), pC1 = new THREE.Vector3(0, hLT, -0.4);
      g3.add(taoMatTamGiac(pA, pB, pC, taoVatLieu(bangMau[9])));
      g3.add(taoMatTamGiac(pA1, pB1, pC1, taoVatLieu(bangMau[10])));
      g3.add(taoMatTuGiac(pA, pB, pB1, pA1, taoVatLieu(bangMau[11])));
      g3.add(taoMatTuGiac(pB, pC, pC1, pB1, taoVatLieu(bangMau[12])));
      g3.add(taoMatTuGiac(pC, pA, pA1, pC1, taoVatLieu(bangMau[13])));
      const wireLT = new THREE.BufferGeometry().setFromPoints([pA,pB,pC,pA, pA1,pB1,pC1,pA1, pB,pB1, pC,pC1]);
      g3.add(new THREE.LineSegments(new THREE.WireframeGeometry(wireLT), matVien));
      [pA, pB, pC, pA1, pB1, pC1].forEach(p => taoDiem(g3, p));
      cacMoHinh['langtru'] = g3;

      // 4. Hình trụ
      const g4 = new THREE.Group();
      const cyl = new THREE.CylinderGeometry(0.38, 0.38, 0.75, 32, 1, true);
      cyl.translate(0, 0.375, 0);
      g4.add(new THREE.Mesh(cyl, taoVatLieu(bangMau[14])));
      g4.add(new THREE.LineSegments(new THREE.WireframeGeometry(cyl), matVien));
      const dDuoi = new THREE.CircleGeometry(0.38, 32); dDuoi.rotateX(Math.PI / 2);
      g4.add(new THREE.Mesh(dDuoi, taoVatLieu(bangMau[15])));
      const dTren = new THREE.CircleGeometry(0.38, 32); dTren.rotateX(-Math.PI / 2); dTren.translate(0, 0.75, 0);
      g4.add(new THREE.Mesh(dTren, taoVatLieu(bangMau[16])));
      g4.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.75, 0), new THREE.Vector3(0, 0, 0)]), matDuongCao));
      cacMoHinh['tru'] = g4;

      // 5. Mặt cầu
      const g5 = new THREE.Group();
      const sph = new THREE.SphereGeometry(0.45, 32, 32); sph.translate(0, 0.45, 0);
      g5.add(new THREE.Mesh(sph, taoVatLieu(bangMau[17], 0.6)));
      g5.add(new THREE.LineSegments(new THREE.WireframeGeometry(sph), matVien));
      const ring = new THREE.RingGeometry(0.445, 0.455, 64); ring.rotateX(Math.PI / 2); ring.translate(0, 0.45, 0);
      g5.add(new THREE.Mesh(ring, new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide })));
      taoDiem(g5, new THREE.Vector3(0, 0.45, 0));
      cacMoHinh['matcau'] = g5;

      // 6. Hình lập phương
      const g6 = new THREE.Group();
      const matsLP = [0,1,2,3,4,5].map(i => taoVatLieu(bangMau[i]));
      const box = new THREE.BoxGeometry(0.65, 0.65, 0.65); box.translate(0, 0.325, 0);
      g6.add(new THREE.Mesh(box, matsLP));
      g6.add(new THREE.LineSegments(new THREE.WireframeGeometry(box), matVien));
      for (let x of [-0.325, 0.325]) for (let y of [0, 0.65]) for (let z of [-0.325, 0.325]) taoDiem(g6, new THREE.Vector3(x, y, z));
      cacMoHinh['lapphuong'] = g6;

      // 7. Hình hộp chữ nhật
      const g7 = new THREE.Group();
      const matsHCN = [6,7,8,9,10,11].map(i => taoVatLieu(bangMau[i]));
      const boxHCN = new THREE.BoxGeometry(0.8, 0.45, 0.55); boxHCN.translate(0, 0.225, 0);
      g7.add(new THREE.Mesh(boxHCN, matsHCN));
      g7.add(new THREE.LineSegments(new THREE.WireframeGeometry(boxHCN), matVien));
      for (let x of [-0.4, 0.4]) for (let y of [0, 0.45]) for (let z of [-0.275, 0.275]) taoDiem(g7, new THREE.Vector3(x, y, z));
      cacMoHinh['hopchunhat'] = g7;

      // 8. Hình nón
      const g8 = new THREE.Group();
      const cone = new THREE.ConeGeometry(0.45, 0.8, 32, 1, true); cone.translate(0, 0.4, 0);
      g8.add(new THREE.Mesh(cone, taoVatLieu(bangMau[12])));
      g8.add(new THREE.LineSegments(new THREE.WireframeGeometry(cone), matVien));
      const cBottom = new THREE.CircleGeometry(0.45, 32); cBottom.rotateX(Math.PI / 2);
      g8.add(new THREE.Mesh(cBottom, taoVatLieu(bangMau[13])));
      g8.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.8, 0), new THREE.Vector3(0, 0, 0)]), matDuongCao));
      taoDiem(g8, new THREE.Vector3(0, 0.8, 0));
      cacMoHinh['non'] = g8;

      // 9. Bát diện đều
      const g9 = new THREE.Group();
      const rOct = 0.46;
      const oTop = new THREE.Vector3(0, rOct + 0.46, 0), oBot = new THREE.Vector3(0, -rOct + 0.46, 0);
      const o1 = new THREE.Vector3(rOct, 0.46, 0), o2 = new THREE.Vector3(0, 0.46, rOct), o3 = new THREE.Vector3(-rOct, 0.46, 0), o4 = new THREE.Vector3(0, 0.46, -rOct);
      [[oTop, o1, o2], [oTop, o2, o3], [oTop, o3, o4], [oTop, o4, o1], [oBot, o2, o1], [oBot, o3, o2], [oBot, o4, o3], [oBot, o1, o4]].forEach((pts, i) => {
        g9.add(taoMatTamGiac(pts[0], pts[1], pts[2], taoVatLieu(bangMau[i % 8])));
      });
      const oct = new THREE.OctahedronGeometry(rOct); oct.translate(0, 0.46, 0);
      g9.add(new THREE.LineSegments(new THREE.WireframeGeometry(oct), matVien));
      [oTop, oBot, o1, o2, o3, o4].forEach(p => taoDiem(g9, p));
      cacMoHinh['batdien'] = g9;

      // 10. 12 mặt đều
      const g10 = new THREE.Group();
      const phi = (1 + Math.sqrt(5)) / 2;
      const a = 0.26, b = a / phi, c = a * phi;
      const vDodeca = [
        new THREE.Vector3(-a, -a, -a), new THREE.Vector3(-a, -a, a), new THREE.Vector3(-a, a, -a), new THREE.Vector3(-a, a, a),
        new THREE.Vector3(a, -a, -a), new THREE.Vector3(a, -a, a), new THREE.Vector3(a, a, -a), new THREE.Vector3(a, a, a),
        new THREE.Vector3(0, -b, -c), new THREE.Vector3(0, -b, c), new THREE.Vector3(0, b, -c), new THREE.Vector3(0, b, c),
        new THREE.Vector3(-b, -c, 0), new THREE.Vector3(-b, c, 0), new THREE.Vector3(b, -c, 0), new THREE.Vector3(b, c, 0),
        new THREE.Vector3(-c, 0, -b), new THREE.Vector3(-c, 0, b), new THREE.Vector3(c, 0, -b), new THREE.Vector3(c, 0, b)
      ];
      vDodeca.forEach(p => p.y += 0.46);
      const mat12 = [
        [3, 11, 7, 15, 13], [7, 11, 9, 5, 19], [7, 19, 18, 6, 15],
        [15, 6, 10, 2, 13], [13, 2, 16, 17, 3], [3, 17, 1, 9, 11],
        [8, 10, 6, 18, 4],  [9, 1, 12, 14, 5],  [5, 14, 4, 18, 19],
        [4, 14, 12, 0, 8],  [10, 8, 0, 16, 2],  [12, 1, 17, 16, 0]
      ];
      mat12.forEach((face, i) => {
        g10.add(taoMatNguGiac(vDodeca[face[0]], vDodeca[face[1]], vDodeca[face[2]], vDodeca[face[3]], vDodeca[face[4]], taoVatLieu(bangMau[i])));
      });
      const dod = new THREE.DodecahedronGeometry(0.44); dod.translate(0, 0.46, 0);
      g10.add(new THREE.LineSegments(new THREE.WireframeGeometry(dod), matVien));
      vDodeca.forEach(p => taoDiem(g10, p));
      cacMoHinh['muoihimat'] = g10;

      // 11. 20 mặt đều
      const g11 = new THREE.Group();
      const rIco = 0.45;
      const tIco = (1 + Math.sqrt(5)) / 2 * (rIco / Math.sqrt(1 + ((1 + Math.sqrt(5))/2)*((1 + Math.sqrt(5))/2)));
      const sIco = (rIco / Math.sqrt(1 + ((1 + Math.sqrt(5))/2)*((1 + Math.sqrt(5))/2)));
      const vIco = [
        new THREE.Vector3(-sIco,  tIco,  0), new THREE.Vector3( sIco,  tIco,  0), new THREE.Vector3(-sIco, -tIco,  0), new THREE.Vector3( sIco, -tIco,  0),
        new THREE.Vector3( 0, -sIco,  tIco), new THREE.Vector3( 0,  sIco,  tIco), new THREE.Vector3( 0, -sIco, -tIco), new THREE.Vector3( 0,  sIco, -tIco),
        new THREE.Vector3( tIco,  0, -sIco), new THREE.Vector3( tIco,  0,  sIco), new THREE.Vector3(-tIco,  0, -sIco), new THREE.Vector3(-tIco,  0,  sIco)
      ];
      vIco.forEach(p => p.y += 0.46);
      const faces20 = [
        [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
        [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
        [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
        [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
      ];
      faces20.forEach((f, i) => {
        g11.add(taoMatTamGiac(vIco[f[0]], vIco[f[1]], vIco[f[2]], taoVatLieu(bangMau[i])));
      });
      const ico = new THREE.IcosahedronGeometry(rIco); ico.translate(0, 0.46, 0);
      g11.add(new THREE.LineSegments(new THREE.WireframeGeometry(ico), matVien));
      vIco.forEach(p => taoDiem(g11, p));
      cacMoHinh['haimuoimat'] = g11;

      // Nạp khối Tứ diện đầu tiên lên màn hình
      mainGroup.add(cacMoHinh['tudien']);
    }

    let dangHienTai = 'tudien';

    window.chonMoHinh = function(loai, btn) {
      document.querySelectorAll('.btn-hinh').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (cacMoHinh[dangHienTai]) mainGroup.remove(cacMoHinh[dangHienTai]);
      if (cacMoHinh[loai]) {
        mainGroup.add(cacMoHinh[loai]);
        dangHienTai = loai;
        document.getElementById('thong-bao').textContent = `Đang hiển thị: ${btn.textContent}`;
      }
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    khoiTaoMoHinh();
    animate();
  </script>
</body>
</html>

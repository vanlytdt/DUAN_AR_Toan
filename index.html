<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Khối Tứ Diện Đều - iPhone & Android</title>
  <!-- Thư viện Model Viewer chuẩn quốc tế cho mọi thiết bị -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; background-color: #0f172a; }
    
    #huong-dan {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); color: #38bdf8; padding: 10px 20px;
      border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #38bdf8;
      pointer-events: none; z-index: 10; text-align: center; width: 80%; max-width: 320px;
    }
    
    #ar-button {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #fbbf24; color: #0f172a; border: none; border-radius: 30px;
      padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); z-index: 10;
    }
  </style>
</head>
<body>

  <div id="huong-dan">Khối Tứ Diện Đều A.BCD<br><span style="font-size: 12px; color: #94a3b8; font-weight: normal;">Bấm nút bên dưới để đặt lên mặt bàn</span></div>

  <!-- Trình hiển thị 3D & AR tương thích 100% iPhone (Quick Look) và Android (Scene Viewer) -->
  <model-viewer 
    id="viewer"
    camera-controls 
    touch-action="pan-y" 
    auto-rotate 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    shadow-intensity="1"
    exposure="1.2">
    
    <button slot="ar-button" id="ar-button">
      XEM TRONG KHÔNG GIAN THỰC (AR)
    </button>
  </model-viewer>

  <!-- Dựng hình 3D Khối Tứ Diện Đều và xuất trực tiếp thành file GLB động -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <script>
    // 1. Tọa độ các đỉnh Tứ diện đều
    const vA = new THREE.Vector3(0, 0.816, 0);
    const vB = new THREE.Vector3(0, 0, 0.577);
    const vC = new THREE.Vector3(-0.5, 0, -0.289);
    const vD = new THREE.Vector3(0.5, 0, -0.289);
    const vH = new THREE.Vector3(0, 0, 0);

    const scene = new THREE.Scene();

    // 2. Tạo các mặt tam giác đều
    const geometry = new THREE.BufferGeometry();
    const vertices = new Float32Array([
      vB.x, vB.y, vB.z,   vC.x, vC.y, vC.z,   vD.x, vD.y, vD.z,
      vA.x, vA.y, vA.z,   vB.x, vB.y, vB.z,   vC.x, vC.y, vC.z,
      vA.x, vA.y, vA.z,   vC.x, vC.y, vC.z,   vD.x, vD.y, vD.z,
      vA.x, vA.y, vA.z,   vD.x, vD.y, vD.z,   vB.x, vB.y, vB.z
    ]);
    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      roughness: 0.2,
      metalness: 0.1,
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // 3. Khung viền và đường cao AH
    const lineMat = new THREE.LineBasicMaterial({ color: 0x0284c7 });
    const wireframe = new THREE.LineSegments(new THREE.WireframeGeometry(geometry), lineMat);
    scene.add(wireframe);

    const lineAH = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([vA, vH]),
      new THREE.LineBasicMaterial({ color: 0xef4444 })
    );
    scene.add(lineAH);

    // 4. Các đỉnh A, B, C, D
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
    [vA, vB, vC, vD].forEach(pt => {
      const sp = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), sphereMat);
      sp.position.copy(pt);
      scene.add(sp);
    });

    // 5. Xuất mô hình sang định dạng GLB để model-viewer hiển thị
    const exporter = new THREE.GLTFExporter();
    exporter.parse(scene, function (gltf) {
      const blob = new Blob([gltf], { type: 'model/gltf-binary' });
      const url = URL.createObjectURL(blob);
      document.getElementById('viewer').src = url;
    }, { binary: true });
  </script>
</body>
</html>

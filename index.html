<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Phòng Học Hình Học Không Gian 12</title>
  
  <!-- Import model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- Import Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
      }
    }
  </script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      --poster-color: transparent;
      --progress-bar-color: #38bdf8;
    }

    /* Menu chọn khối hình */
    #menu-chon {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 100;
      width: 95%;
      max-width: 900px;
      overflow-x: auto;
      padding: 8px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      -webkit-overflow-scrolling: touch;
    }

    .btn-hinh {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .btn-hinh:hover {
      background: rgba(56, 189, 248, 0.3);
      color: white;
    }

    .btn-hinh.active {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.5);
    }

    /* Trạng thái */
    #trang-thai {
      position: fixed;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
      z-index: 110;
      padding: 6px 16px;
      border-radius: 15px;
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* Nút AR - đặt trong model-viewer */
    #ar-button {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #fbbf24;
      color: #0f172a;
      border: none;
      border-radius: 30px;
      padding: 14px 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.5);
      z-index: 100;
      transition: all 0.3s;
    }

    #ar-button:hover {
      background: #fcd34d;
      transform: translateX(-50%) scale(1.05);
    }

    @media (max-width: 600px) {
      .btn-hinh {
        padding: 6px 10px;
        font-size: 11px;
      }
      #ar-button {
        padding: 12px 20px;
        font-size: 14px;
        bottom: 15px;
      }
      #trang-thai {
        top: 60px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <!-- Menu chọn hình -->
  <div id="menu-chon">
    <button class="btn-hinh active" onclick="chonMoHinh('tudien', this)">Tứ diện đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('choptugiac', this)">Chóp tứ giác</button>
    <button class="btn-hinh" onclick="chonMoHinh('langtru', this)">Lăng trụ</button>
    <button class="btn-hinh" onclick="chonMoHinh('tru', this)">Hình trụ</button>
    <button class="btn-hinh" onclick="chonMoHinh('matcau', this)">Mặt cầu</button>
    <button class="btn-hinh" onclick="chonMoHinh('lapphuong', this)">Lập phương</button>
    <button class="btn-hinh" onclick="chonMoHinh('hopchunhat', this)">Hộp chữ nhật</button>
    <button class="btn-hinh" onclick="chonMoHinh('non', this)">Hình nón</button>
    <button class="btn-hinh" onclick="chonMoHinh('batdien', this)">Bát diện</button>
    <button class="btn-hinh" onclick="chonMoHinh('muoihimat', this)">12 mặt</button>
    <button class="btn-hinh" onclick="chonMoHinh('haimuoimat', this)">20 mặt</button>
  </div>

  <div id="trang-thai">Đang tải mô hình...</div>

  <!-- Model viewer với AR -->
  <model-viewer 
    id="viewer"
    camera-controls 
    touch-action="pan-y" 
    auto-rotate 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    shadow-intensity="1"
    exposure="1.2"
    ar-scale="auto">
    
    <button slot="ar-button" id="ar-button">
      📷 XEM TRONG KHÔNG GIAN THỰC (AR)
    </button>
  </model-viewer>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    
    const exporter = new GLTFExporter();
    const viewer = document.getElementById('viewer');
    const trangThai = document.getElementById('trang-thai');
    const cacMoHinh = {};

    // Bảng 20 màu sắc tươi sáng, đa dạng
    const bangMau = [
      0xFF6B6B, // Đỏ tươi
      0x4ECDC4, // Xanh ngọc
      0x45B7D1, // Xanh da trời
      0x96CEB4, // Xanh lá nhạt
      0xFFEEAD, // Vàng nhạt
      0xD4A5A5, // Hồng nhạt
      0x9B59B6, // Tím
      0x3498DB, // Xanh dương
      0xE67E22, // Cam
      0x1ABC9C, // Ngọc lục bảo
      0xF1C40F, // Vàng
      0xE74C3C, // Đỏ gạch
      0x2ECC71, // Xanh lá
      0xE91E63, // Hồng đậm
      0x00BCD4, // Cyan
      0xFF9800, // Cam sáng
      0x8BC34A, // Xanh lá nhạt
      0x673AB7, // Tím đậm
      0x03A9F4, // Xanh nhạt
      0xFF5722  // Cam đỏ
    ];

    // Hàm tạo vật liệu với màu sắc riêng
    function taoVatLieu(mau, doTrongSuot = 0.9) {
      return new THREE.MeshPhongMaterial({
        color: mau,
        opacity: doTrongSuot,
        transparent: true,
        shininess: 40,
        side: THREE.DoubleSide,
        specular: 0x444444
      });
    }

    // Hàm tạo đỉnh (sphere nhỏ) - GIẢM KÍCH THƯỚC
    function taoDinh(scene, viTri, mau = 0xFF0000, kichThuoc = 0.025) {
      const sphereGeometry = new THREE.SphereGeometry(kichThuoc, 8, 8);
      const sphereMaterial = new THREE.MeshPhongMaterial({
        color: mau,
        shininess: 100,
        emissive: mau,
        emissiveIntensity: 0.2
      });
      const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
      sphere.position.copy(viTri);
      scene.add(sphere);
    }

    // Hàm tạo cạnh (đường nối)
    function themCanh(scene, diem1, diem2, mau = 0x444444) {
      const geometry = new THREE.BufferGeometry().setFromPoints([diem1, diem2]);
      const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ 
        color: mau, 
        linewidth: 1 
      }));
      scene.add(line);
    }

    // Hàm tạo mặt tam giác với màu riêng
    function taoMatTamGiac(p1, p2, p3, mau) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, taoVatLieu(mau));
    }

    // Hàm tạo mặt tứ giác với màu riêng
    function taoMatTuGiac(p1, p2, p3, p4, mau) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z,
        p3.x, p3.y, p3.z,
        p4.x, p4.y, p4.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, taoVatLieu(mau));
    }

    // Hàm tạo mặt ngũ giác với màu riêng
    function taoMatNguGiac(p1, p2, p3, p4, p5, mau) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        p1.x, p1.y, p1.z,
        p2.x, p2.y, p2.z,
        p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z,
        p3.x, p3.y, p3.z,
        p4.x, p4.y, p4.z,
        p1.x, p1.y, p1.z,
        p4.x, p4.y, p4.z,
        p5.x, p5.y, p5.z
      ]);
      geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, taoVatLieu(mau));
    }

    // Hàm tạo các mô hình
    function taoTatCaMoHinh() {
      const danhSach = [];

      // 1. Tứ diện đều - 4 mặt, 4 đỉnh
      const scene1 = new THREE.Scene();
      const A = new THREE.Vector3(0, 0.8, 0);
      const B = new THREE.Vector3(0, 0, 0.6);
      const C = new THREE.Vector3(-0.5, 0, -0.3);
      const D = new THREE.Vector3(0.5, 0, -0.3);
      
      scene1.add(taoMatTamGiac(B, C, D, bangMau[0]));
      scene1.add(taoMatTamGiac(A, B, C, bangMau[1]));
      scene1.add(taoMatTamGiac(A, C, D, bangMau[2]));
      scene1.add(taoMatTamGiac(A, D, B, bangMau[3]));
      
      themCanh(scene1, A, B);
      themCanh(scene1, A, C);
      themCanh(scene1, A, D);
      themCanh(scene1, B, C);
      themCanh(scene1, C, D);
      themCanh(scene1, D, B);
      
      // Đỉnh nhỏ
      taoDinh(scene1, A);
      taoDinh(scene1, B);
      taoDinh(scene1, C);
      taoDinh(scene1, D);
      
      danhSach.push({ id: 'tudien', scene: scene1 });

      // 2. Chóp tứ giác đều
      const scene2 = new THREE.Scene();
      const S = new THREE.Vector3(0, 0.8, 0);
      const A2 = new THREE.Vector3(-0.4, 0, 0.4);
      const B2 = new THREE.Vector3(0.4, 0, 0.4);
      const C2 = new THREE.Vector3(0.4, 0, -0.4);
      const D2 = new THREE.Vector3(-0.4, 0, -0.4);
      
      scene2.add(taoMatTuGiac(A2, B2, C2, D2, bangMau[4]));
      scene2.add(taoMatTamGiac(S, A2, B2, bangMau[5]));
      scene2.add(taoMatTamGiac(S, B2, C2, bangMau[6]));
      scene2.add(taoMatTamGiac(S, C2, D2, bangMau[7]));
      scene2.add(taoMatTamGiac(S, D2, A2, bangMau[8]));
      
      themCanh(scene2, S, A2);
      themCanh(scene2, S, B2);
      themCanh(scene2, S, C2);
      themCanh(scene2, S, D2);
      themCanh(scene2, A2, B2);
      themCanh(scene2, B2, C2);
      themCanh(scene2, C2, D2);
      themCanh(scene2, D2, A2);
      
      taoDinh(scene2, S, 0xFF0000, 0.03);
      taoDinh(scene2, A2);
      taoDinh(scene2, B2);
      taoDinh(scene2, C2);
      taoDinh(scene2, D2);
      
      danhSach.push({ id: 'choptugiac', scene: scene2 });

      // 3. Lăng trụ tam giác
      const scene3 = new THREE.Scene();
      const h = 0.7;
      const pA = new THREE.Vector3(-0.35, 0, 0.35);
      const pB = new THREE.Vector3(0.35, 0, 0.35);
      const pC = new THREE.Vector3(0, 0, -0.4);
      const pA1 = new THREE.Vector3(-0.35, h, 0.35);
      const pB1 = new THREE.Vector3(0.35, h, 0.35);
      const pC1 = new THREE.Vector3(0, h, -0.4);
      
      scene3.add(taoMatTamGiac(pA, pB, pC, bangMau[9]));
      scene3.add(taoMatTamGiac(pA1, pB1, pC1, bangMau[10]));
      scene3.add(taoMatTuGiac(pA, pB, pB1, pA1, bangMau[11]));
      scene3.add(taoMatTuGiac(pB, pC, pC1, pB1, bangMau[12]));
      scene3.add(taoMatTuGiac(pC, pA, pA1, pC1, bangMau[13]));
      
      themCanh(scene3, pA, pA1);
      themCanh(scene3, pB, pB1);
      themCanh(scene3, pC, pC1);
      themCanh(scene3, pA, pB);
      themCanh(scene3, pB, pC);
      themCanh(scene3, pC, pA);
      themCanh(scene3, pA1, pB1);
      themCanh(scene3, pB1, pC1);
      themCanh(scene3, pC1, pA1);
      
      taoDinh(scene3, pA);
      taoDinh(scene3, pB);
      taoDinh(scene3, pC);
      taoDinh(scene3, pA1);
      taoDinh(scene3, pB1);
      taoDinh(scene3, pC1);
      
      danhSach.push({ id: 'langtru', scene: scene3 });

      // 4. Hình trụ
      const scene4 = new THREE.Scene();
      
      const truGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.7, 32);
      truGeometry.translate(0, 0.35, 0);
      scene4.add(new THREE.Mesh(truGeometry, taoVatLieu(bangMau[14], 0.7)));
      
      const dayDuoi = new THREE.CircleGeometry(0.35, 32);
      dayDuoi.rotateX(-Math.PI / 2);
      scene4.add(new THREE.Mesh(dayDuoi, taoVatLieu(bangMau[15], 0.9)));
      
      const dayTren = new THREE.CircleGeometry(0.35, 32);
      dayTren.rotateX(Math.PI / 2);
      dayTren.translate(0, 0.7, 0);
      scene4.add(new THREE.Mesh(dayTren, taoVatLieu(bangMau[16], 0.9)));
      
      taoDinh(scene4, new THREE.Vector3(0, 0, 0), 0xFF0000, 0.02);
      taoDinh(scene4, new THREE.Vector3(0, 0.7, 0), 0xFF0000, 0.02);
      
      danhSach.push({ id: 'tru', scene: scene4 });

      // 5. Mặt cầu
      const scene5 = new THREE.Scene();
      const cauGeometry = new THREE.SphereGeometry(0.45, 32, 32);
      cauGeometry.translate(0, 0.45, 0);
      scene5.add(new THREE.Mesh(cauGeometry, taoVatLieu(bangMau[17], 0.6)));
      
      taoDinh(scene5, new THREE.Vector3(0, 0.45, 0), 0xFF0000, 0.02);
      taoDinh(scene5, new THREE.Vector3(0, 0.9, 0), 0xFFD700, 0.015);
      taoDinh(scene5, new THREE.Vector3(0, 0, 0), 0xFFD700, 0.015);
      
      danhSach.push({ id: 'matcau', scene: scene5 });

      // 6. Hình lập phương
      const scene6 = new THREE.Scene();
      const lapPhuongGeometry = new THREE.BoxGeometry(0.65, 0.65, 0.65);
      lapPhuongGeometry.translate(0, 0.325, 0);
      
      const materialsLP = [
        taoVatLieu(bangMau[18], 0.9),
        taoVatLieu(bangMau[19], 0.9),
        taoVatLieu(bangMau[0], 0.9),
        taoVatLieu(bangMau[1], 0.9),
        taoVatLieu(bangMau[2], 0.9),
        taoVatLieu(bangMau[3], 0.9)
      ];
      scene6.add(new THREE.Mesh(lapPhuongGeometry, materialsLP));
      
      const offset = 0.325;
      for (let x of [-offset, offset]) {
        for (let y of [0, 0.65]) {
          for (let z of [-offset, offset]) {
            taoDinh(scene6, new THREE.Vector3(x, y, z), 0xFF0000, 0.025);
          }
        }
      }
      
      danhSach.push({ id: 'lapphuong', scene: scene6 });

      // 7. Hình hộp chữ nhật
      const scene7 = new THREE.Scene();
      const hopGeometry = new THREE.BoxGeometry(0.75, 0.4, 0.5);
      hopGeometry.translate(0, 0.2, 0);
      
      const materialsHop = [
        taoVatLieu(bangMau[4], 0.9),
        taoVatLieu(bangMau[5], 0.9),
        taoVatLieu(bangMau[6], 0.9),
        taoVatLieu(bangMau[7], 0.9),
        taoVatLieu(bangMau[8], 0.9),
        taoVatLieu(bangMau[9], 0.9)
      ];
      scene7.add(new THREE.Mesh(hopGeometry, materialsHop));
      
      const dx = 0.375, dy = 0.4, dz = 0.25;
      for (let x of [-dx, dx]) {
        for (let y of [0, dy]) {
          for (let z of [-dz, dz]) {
            taoDinh(scene7, new THREE.Vector3(x, y, z), 0xFF0000, 0.025);
          }
        }
      }
      
      danhSach.push({ id: 'hopchunhat', scene: scene7 });

      // 8. Hình nón
      const scene8 = new THREE.Scene();
      const nonGeometry = new THREE.ConeGeometry(0.4, 0.75, 32);
      nonGeometry.translate(0, 0.375, 0);
      scene8.add(new THREE.Mesh(nonGeometry, taoVatLieu(bangMau[10], 0.8)));
      
      const dayNon = new THREE.CircleGeometry(0.4, 32);
      dayNon.rotateX(-Math.PI / 2);
      scene8.add(new THREE.Mesh(dayNon, taoVatLieu(bangMau[11], 0.9)));
      
      taoDinh(scene8, new THREE.Vector3(0, 0.75, 0), 0xFF0000, 0.03);
      taoDinh(scene8, new THREE.Vector3(0, 0, 0), 0xFFD700, 0.02);
      
      danhSach.push({ id: 'non', scene: scene8 });

      // 9. Bát diện đều
      const scene9 = new THREE.Scene();
      const rOct = 0.45;
      const tamY = 0.45;
      const oTop = new THREE.Vector3(0, rOct + tamY, 0);
      const oBot = new THREE.Vector3(0, -rOct + tamY, 0);
      const o1 = new THREE.Vector3(rOct, tamY, 0);
      const o2 = new THREE.Vector3(0, tamY, rOct);
      const o3 = new THREE.Vector3(-rOct, tamY, 0);
      const o4 = new THREE.Vector3(0, tamY, -rOct);
      
      const matOct = [
        [oTop, o1, o2], [oTop, o2, o3], [oTop, o3, o4], [oTop, o4, o1],
        [oBot, o2, o1], [oBot, o3, o2], [oBot, o4, o3], [oBot, o1, o4]
      ];
      matOct.forEach((face, i) => {
        scene9.add(taoMatTamGiac(face[0], face[1], face[2], bangMau[i]));
      });
      
      themCanh(scene9, oTop, o1); themCanh(scene9, oTop, o2);
      themCanh(scene9, oTop, o3); themCanh(scene9, oTop, o4);
      themCanh(scene9, oBot, o1); themCanh(scene9, oBot, o2);
      themCanh(scene9, oBot, o3); themCanh(scene9, oBot, o4);
      themCanh(scene9, o1, o2); themCanh(scene9, o2, o3);
      themCanh(scene9, o3, o4); themCanh(scene9, o4, o1);
      
      taoDinh(scene9, oTop, 0xFF0000, 0.025);
      taoDinh(scene9, oBot, 0xFF0000, 0.025);
      taoDinh(scene9, o1, 0xFF0000, 0.02);
      taoDinh(scene9, o2, 0xFF0000, 0.02);
      taoDinh(scene9, o3, 0xFF0000, 0.02);
      taoDinh(scene9, o4, 0xFF0000, 0.02);
      
      danhSach.push({ id: 'batdien', scene: scene9 });

      // 10. 12 mặt đều
      const scene10 = new THREE.Scene();
      const phi = (1 + Math.sqrt(5)) / 2;
      const a = 0.25, b = a / phi, c = a * phi;
      const tamYDod = 0.45;
      const verticesDod = [
        new THREE.Vector3(-a, -a, -a), new THREE.Vector3(-a, -a, a),
        new THREE.Vector3(-a, a, -a), new THREE.Vector3(-a, a, a),
        new THREE.Vector3(a, -a, -a), new THREE.Vector3(a, -a, a),
        new THREE.Vector3(a, a, -a), new THREE.Vector3(a, a, a),
        new THREE.Vector3(0, -b, -c), new THREE.Vector3(0, -b, c),
        new THREE.Vector3(0, b, -c), new THREE.Vector3(0, b, c),
        new THREE.Vector3(-b, -c, 0), new THREE.Vector3(-b, c, 0),
        new THREE.Vector3(b, -c, 0), new THREE.Vector3(b, c, 0),
        new THREE.Vector3(-c, 0, -b), new THREE.Vector3(-c, 0, b),
        new THREE.Vector3(c, 0, -b), new THREE.Vector3(c, 0, b)
      ];
      verticesDod.forEach(v => v.y += tamYDod);
      
      const indicesFaces = [
        [3, 11, 7, 15, 13], [7, 11, 9, 5, 19], [7, 19, 18, 6, 15],
        [15, 6, 10, 2, 13], [13, 2, 16, 17, 3], [3, 17, 1, 9, 11],
        [8, 10, 6, 18, 4], [9, 1, 12, 14, 5], [5, 14, 4, 18, 19],
        [4, 14, 12, 0, 8], [10, 8, 0, 16, 2], [12, 1, 17, 16, 0]
      ];
      indicesFaces.forEach((face, i) => {
        const pts = face.map(idx => verticesDod[idx]);
        scene10.add(taoMatNguGiac(pts[0], pts[1], pts[2], pts[3], pts[4], bangMau[i % bangMau.length]));
      });
      
      verticesDod.forEach(v => {
        taoDinh(scene10, v, 0xFF0000, 0.015);
      });
      
      danhSach.push({ id: 'muoihimat', scene: scene10 });

      // 11. 20 mặt đều
      const scene11 = new THREE.Scene();
      const rIco = 0.42;
      const tamYIco = 0.42;
      const t = (1 + Math.sqrt(5)) / 2;
      const s = rIco / Math.sqrt(1 + t*t);
      const verticesIco = [
        new THREE.Vector3(-s, t*s, 0), new THREE.Vector3(s, t*s, 0),
        new THREE.Vector3(-s, -t*s, 0), new THREE.Vector3(s, -t*s, 0),
        new THREE.Vector3(0, -s, t*s), new THREE.Vector3(0, s, t*s),
        new THREE.Vector3(0, -s, -t*s), new THREE.Vector3(0, s, -t*s),
        new THREE.Vector3(t*s, 0, -s), new THREE.Vector3(t*s, 0, s),
        new THREE.Vector3(-t*s, 0, -s), new THREE.Vector3(-t*s, 0, s)
      ];
      verticesIco.forEach(v => v.y += tamYIco);
      
      const facesIco = [
        [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
        [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
        [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
        [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
      ];
      facesIco.forEach((face, i) => {
        const pts = face.map(idx => verticesIco[idx]);
        scene11.add(taoMatTamGiac(pts[0], pts[1], pts[2], bangMau[i % bangMau.length]));
      });
      
      verticesIco.forEach(v => {
        taoDinh(scene11, v, 0xFF0000, 0.015);
      });
      
      danhSach.push({ id: 'haimuoimat', scene: scene11 });

      return danhSach;
    }

    // Xuất và gán mô hình
    function xuatVaGanMoHinh() {
      const danhSachMoHinh = taoTatCaMoHinh();
      
      danhSachMoHinh.forEach((item, index) => {
        try {
          exporter.parse(item.scene, function(gltf) {
            const blob = new Blob([gltf], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            cacMoHinh[item.id] = url;
            
            // Hiển thị mô hình đầu tiên
            if (index === 0) {
              viewer.src = url;
              trangThai.textContent = '✅ Đã tải xong! Mỗi mặt có 1 màu riêng';
              setTimeout(() => {
                trangThai.style.opacity = '0';
              }, 3000);
            }
          }, function(error) {
            console.error('Lỗi xuất mô hình ' + item.id + ':', error);
          }, { binary: true });
        } catch (e) {
          console.error('Lỗi khi xử lý ' + item.id + ':', e);
        }
      });
    }

    // Hàm chọn mô hình (global)
    window.chonMoHinh = function(loai, btn) {
      // Cập nhật button active
      document.querySelectorAll('.btn-hinh').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      
      if (cacMoHinh[loai]) {
        viewer.src = cacMoHinh[loai];
        const tenHinh = btn ? btn.textContent.trim() : loai;
        trangThai.textContent = '🔍 ' + tenHinh + ' - Mỗi mặt 1 màu';
        trangThai.style.opacity = '1';
        setTimeout(() => {
          trangThai.style.opacity = '0';
        }, 2000);
      } else {
        trangThai.textContent = '⏳ Đang tải mô hình...';
        trangThai.style.opacity = '1';
      }
    };

    // Khởi tạo
    window.addEventListener('load', () => {
      setTimeout(() => {
        xuatVaGanMoHinh();
      }, 1000);
    });

    // Xử lý lỗi
    viewer.addEventListener('error', (event) => {
      console.error('Model-viewer error:', event);
      trangThai.textContent = '⚠️ Có lỗi xảy ra, vui lòng tải lại trang';
      trangThai.style.opacity = '1';
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Khối Tứ Diện Đều</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #bang-thong-bao {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92); color: white; padding: 12px 20px;
      border-radius: 12px; text-align: center; z-index: 9999; font-size: 14px;
      width: 85%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
    #tieu-de { font-weight: bold; color: #38bdf8; font-size: 16px; margin-bottom: 4px; }
    
    #lop-kich-hoat {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.96); z-index: 99999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #btn-kich-hoat {
      padding: 14px 28px; font-size: 16px; font-weight: bold;
      background: #38bdf8; color: #0f172a; border: none;
      border-radius: 30px; cursor: pointer; margin-top: 15px;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div id="lop-kich-hoat">
    <h2 style="margin: 0; font-size: 20px; color: #38bdf8;">HÌNH HỌC KHÔNG GIAN 12</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-top: 8px;">Quan sát Khối Tứ Diện Đều A.BCD</p>
    <button id="btn-kich-hoat" onclick="moKhoaTraiNghiem()">BẮT ĐẦU QUAN SÁT</button>
  </div>

  <div id="bang-thong-bao">
    <div id="tieu-de">Khối Tứ Diện Đều A.BCD</div>
    <div id="noi-dung">Hãy hướng camera vào thẻ và xoay quanh để ngắm các mặt</div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 1000; warmupTolerance: 3; missTolerance: 15;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <!-- Ánh sáng môi trường dịu mắt -->
    <a-light type="ambient" color="#ffffff" intensity="1.4"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.0" position="1 3 2"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Gắn trực tiếp lên thẻ nhận diện mục tiêu -->
    <a-entity id="target-marker" mindar-image-target="targetIndex: 0">
      
      <!-- Cụm khối tứ diện đều: Kích thước chuẩn vừa vặn thẻ -->
      <a-entity id="khoi-tu-dien" position="0 0.1 0" scale="0.8 0.8 0.8">
        <a-entity id="mesh-container"></a-entity>
        <a-text value="Tu dien deu A.BCD" position="0 1.05 0" align="center" scale="0.6 0.6 0.6" color="#fbbf24"></a-text>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    let giongNoiChuan = null;

    function layGiongDoc() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        giongNoiChuan = voices.find(v => v.lang.includes('vi')) || null;
      }
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = layGiongDoc;

    function moKhoaTraiNghiem() {
      document.getElementById('lop-kich-hoat').style.display = 'none';
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance('Khối tứ diện đều có bốn mặt là các tam giác đều bằng nhau.');
        msg.lang = 'vi-VN';
        if (giongNoiChuan) msg.voice = giongNoiChuan;
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    const meshContainer = document.querySelector('#mesh-container');
    const tieuDe = document.querySelector('#tieu-de');
    const noiDung = document.querySelector('#noi-dung');
    const targetMarker = document.querySelector('#target-marker');

    // DỰNG TỨ DIỆN ĐỀU CHUẨN XÁC VỚI THREE.JS
    const vA = new THREE.Vector3(0, 0.816, 0);          // Đỉnh A
    const vB = new THREE.Vector3(0, 0, 0.577);          // Đỉnh B
    const vC = new THREE.Vector3(-0.5, 0, -0.289);      // Đỉnh C
    const vD = new THREE.Vector3(0.5, 0, -0.289);       // Đỉnh D
    const vH = new THREE.Vector3(0, 0, 0);              // Trọng tâm đáy H

    const geometry = new THREE.BufferGeometry();
    const vertices = new Float32Array([
      // Mặt đáy BCD
      vB.x, vB.y, vB.z,   vC.x, vC.y, vC.z,   vD.x, vD.y, vD.z,
      // Mặt bên ABC
      vA.x, vA.y, vA.z,   vB.x, vB.y, vB.z,   vC.x, vC.y, vC.z,
      // Mặt bên ACD
      vA.x, vA.y, vA.z,   vC.x, vC.y, vC.z,   vD.x, vD.y, vD.z,
      // Mặt bên ADB
      vA.x, vA.y, vA.z,   vD.x, vD.y, vD.z,   vB.x, vB.y, vB.z
    ]);
    geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    geometry.computeVertexNormals();

    const mesh = new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color: 0x38bdf8,
        opacity: 0.65,
        transparent: true,
        side: THREE.DoubleSide,
        roughness: 0.1,
        metalness: 0.2
      })
    );

    const wireframe = new THREE.LineSegments(
      new THREE.WireframeGeometry(geometry),
      new THREE.LineBasicMaterial({ color: 0x0284c7, linewidth: 3 })
    );

    // Đường cao AH màu đỏ nét liền
    const lineAHGeom = new THREE.BufferGeometry().setFromPoints([vA, vH]);
    const lineAH = new THREE.Line(
      lineAHGeom,
      new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 })
    );

    const group = new THREE.Group();
    group.add(mesh);
    group.add(wireframe);
    group.add(lineAH);
    meshContainer.setObject3D('mesh', group);

    const taoDiem = (pos, ten, offset) => {
      const sp = document.createElement('a-sphere');
      sp.setAttribute('radius', '0.035');
      sp.setAttribute('color', '#dc2626');
      sp.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
      
      const txt = document.createElement('a-text');
      txt.setAttribute('value', ten);
      txt.setAttribute('position', `${pos.x + offset.x} ${pos.y + offset.y} ${pos.z + offset.z}`);
      txt.setAttribute('scale', '0.55 0.55 0.55');
      txt.setAttribute('color', '#ffffff');
      txt.setAttribute('align', 'center');
      
      meshContainer.appendChild(sp);
      meshContainer.appendChild(txt);
    };

    taoDiem(vA, 'A', {x: 0, y: 0.08, z: 0});
    taoDiem(vB, 'B', {x: 0, y: -0.06, z: 0.06});
    taoDiem(vC, 'C', {x: -0.06, y: -0.06, z: 0});
    taoDiem(vD, 'D', {x: 0.06, y: -0.06, z: 0});
    taoDiem(vH, 'H', {x: 0, y: -0.06, z: -0.06});

    targetMarker.addEventListener('targetFound', () => {
      tieuDe.innerText = "Đã nhận diện: Tứ Diện Đều A.BCD";
      noiDung.innerText = "Khối hình đang hiển thị trực tiếp trên mặt thẻ";
    });

    targetMarker.addEventListener('targetLost', () => {
      tieuDe.innerText = "Tìm thẻ...";
      noiDung.innerText = "Hãy giữ camera hướng về phía thẻ nhận diện";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>MATH-AR-V3 — Android + iPhone</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;font-family:Segoe UI,Tahoma,sans-serif}
    model-viewer{width:100%;height:100%;background:#0f172a;--poster-color:transparent;--progress-bar-color:#38bdf8}
    #menu{
      position:fixed;z-index:100;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
      width:min(96vw,950px);display:flex;gap:6px;overflow-x:auto;padding:8px;border-radius:24px;
      background:rgba(15,23,42,.94);border:1px solid rgba(255,255,255,.18);-webkit-overflow-scrolling:touch
    }
    .shape-btn{flex:0 0 auto;border:0;border-radius:18px;padding:8px 13px;color:#cbd5e1;background:rgba(255,255,255,.08);font-weight:700}
    .shape-btn.active{background:#38bdf8;color:#082f49}
    #status{
      position:fixed;z-index:110;top:70px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:15px;
      color:#dbeafe;background:rgba(15,23,42,.9);border:1px solid rgba(56,189,248,.35);font-size:12px;text-align:center
    }
    #device{
      position:fixed;z-index:111;right:10px;top:70px;max-width:58vw;padding:6px 10px;border-radius:999px;
      color:#dbeafe;background:rgba(15,23,42,.9);font-size:11px;text-align:center
    }
    #ar-button{
      position:fixed;z-index:120;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translateX(-50%);
      border:0;border-radius:30px;padding:14px 24px;background:#fbbf24;color:#0f172a;font-weight:900;font-size:15px;
      box-shadow:0 5px 18px rgba(251,191,36,.4)
    }
    #help{
      position:fixed;z-index:119;left:50%;bottom:calc(env(safe-area-inset-bottom) + 88px);transform:translateX(-50%);
      width:min(92vw,520px);padding:8px 12px;border-radius:14px;background:rgba(3,105,161,.88);color:#e0f2fe;
      font-size:12px;text-align:center
    }
    @media(max-width:600px){
      .shape-btn{font-size:11px;padding:7px 10px}
      #status{top:60px;font-size:11px}
      #device{top:60px;font-size:10px}
      #ar-button{font-size:14px;padding:12px 18px}
    }
  </style>
</head>
<body>

<model-viewer
  id="viewer"
  src="./models/tudien.glb"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  shadow-intensity="1"
  exposure="1.15"
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-placement="floor"
  ar-scale="fixed"
  xr-environment>

  <button slot="ar-button" id="ar-button">📷 XEM TRONG KHÔNG GIAN THỰC (AR)</button>
</model-viewer>

<div id="menu">
  <button class="shape-btn active" data-id="tudien">Tứ diện đều</button>
  <button class="shape-btn" data-id="choptugiac">Chóp tứ giác</button>
  <button class="shape-btn" data-id="langtru">Lăng trụ</button>
  <button class="shape-btn" data-id="tru">Hình trụ</button>
  <button class="shape-btn" data-id="matcau">Mặt cầu</button>
  <button class="shape-btn" data-id="lapphuong">Lập phương</button>
  <button class="shape-btn" data-id="hopchunhat">Hộp chữ nhật</button>
  <button class="shape-btn" data-id="non">Hình nón</button>
  <button class="shape-btn" data-id="batdien">Bát diện</button>
  <button class="shape-btn" data-id="muoihimat">12 mặt</button>
  <button class="shape-btn" data-id="haimuoimat">20 mặt</button>
</div>

<div id="status">Đang tải mô hình…</div>
<div id="device">Đang kiểm tra AR…</div>
<div id="help">Android: mở bằng Chrome, hướng camera xuống mặt bàn/sàn có họa tiết và đủ sáng, di chuyển điện thoại chậm sang trái–phải khoảng 2–3 giây rồi chạm để đặt mô hình. iPhone: dùng Safari.</div>

<script>
  const viewer = document.getElementById('viewer');
  const statusEl = document.getElementById('status');
  const deviceEl = document.getElementById('device');

  const models = {
    tudien: './models/tudien.glb',
    choptugiac: './models/choptugiac.glb',
    langtru: './models/langtru.glb',
    tru: './models/tru.glb',
    matcau: './models/matcau.glb',
    lapphuong: './models/lapphuong.glb',
    hopchunhat: './models/hopchunhat.glb',
    non: './models/non.glb',
    batdien: './models/batdien.glb',
    muoihimat: './models/muoihimat.glb',
    haimuoimat: './models/haimuoimat.glb'
  };

  function absoluteModelUrl(path) {
    return new URL(path, window.location.href).href;
  }

  function selectModel(id, btn) {
    document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    // QUAN TRỌNG: gán URL HTTPS thật, không dùng blob:
    viewer.src = absoluteModelUrl(models[id]);
    statusEl.textContent = '⏳ Đang tải ' + (btn ? btn.textContent.trim() : id) + '…';
    statusEl.style.opacity = '1';
  }

  document.querySelectorAll('.shape-btn').forEach(btn => {
    btn.addEventListener('click', () => selectModel(btn.dataset.id, btn));
  });

  viewer.addEventListener('load', () => {
    statusEl.textContent = '✅ Mô hình đã sẵn sàng — bấm AR';
    setTimeout(() => statusEl.style.opacity = '.35', 2200);
  });

  viewer.addEventListener('error', e => {
    console.error(e);
    statusEl.textContent = '⚠️ Không tải được GLB. Kiểm tra thư mục /models.';
    statusEl.style.opacity = '1';
  });

  viewer.addEventListener('ar-status', event => {
    const s = event.detail.status;
    if (s === 'session-started') {
      statusEl.textContent = '📐 AR đang hoạt động';
      statusEl.style.opacity = '1';
    } else if (s === 'failed') {
      statusEl.textContent = '⚠️ AR không mở được trên thiết bị này';
      statusEl.style.opacity = '1';
    }
  });

  
  function optimizeARModeForDevice() {
    const ua = navigator.userAgent || '';
    const android = /Android/i.test(ua);
    const ios = /iPhone|iPad|iPod/i.test(ua);

    // Android: ưu tiên Scene Viewer vì nhận mặt phẳng thường ổn định hơn.
    if (android) {
      viewer.setAttribute('ar-modes', 'scene-viewer webxr quick-look');
      viewer.setAttribute('ar-scale', 'fixed');
      viewer.setAttribute('ar-placement', 'floor');
    } else if (ios) {
      viewer.setAttribute('ar-modes', 'quick-look webxr scene-viewer');
      viewer.setAttribute('ar-scale', 'fixed');
      viewer.setAttribute('ar-placement', 'floor');
    }
  }

async function detectAR() {
    let webxr = false;
    try {
      webxr = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar'));
    } catch (_) {}

    const ua = navigator.userAgent || '';
    const android = /Android/i.test(ua);
    const ios = /iPhone|iPad|iPod/i.test(ua);

    if (webxr) {
      deviceEl.textContent = '✅ WebXR AR hỗ trợ';
      deviceEl.style.color = '#bbf7d0';
    } else if (android) {
      deviceEl.textContent = 'Android: ưu tiên Scene Viewer • quét mặt bàn/sàn có chi tiết, đủ sáng';
      deviceEl.style.color = '#fde68a';
    } else if (ios) {
      deviceEl.textContent = 'iPhone/iPad: Quick Look AR';
      deviceEl.style.color = '#bbf7d0';
    } else {
      deviceEl.textContent = 'Xem 3D; AR tùy thiết bị';
      deviceEl.style.color = '#fde68a';
    }
  }

  // Gán URL tuyệt đối ngay từ đầu để Android Scene Viewer có thể tải trực tiếp.
  viewer.src = absoluteModelUrl(models.tudien);
  optimizeARModeForDevice();
  detectAR();
</script>
</body>
</html>

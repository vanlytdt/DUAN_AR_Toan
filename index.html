<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Phòng Học Hình Học Không Gian 12</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; background-color: #0f172a; }
    
    #menu-chon {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100; width: 92%; max-width: 480px;
      overflow-x: auto; padding: 6px; background: rgba(15, 23, 42, 0.9);
      border-radius: 25px; border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn-hinh {
      padding: 8px 14px; font-size: 13px; font-weight: bold; color: #94a3b8;
      background: transparent; border: none; border-radius: 20px; cursor: pointer;
      white-space: nowrap; transition: 0.2s; flex-shrink: 0;
    }
    .btn-hinh.active { background: #38bdf8; color: #0f172a; }
    
    #ar-button {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: #fbbf24; color: #0f172a; border: none; border-radius: 30px;
      padding: 14px 28px; font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4); z-index: 100;
    }
  </style>
</head>
<body>

  <div id="menu-chon">
    <button class="btn-hinh active" onclick="chonMoHinh('tudien', this)">Tứ diện đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('choptugiac', this)">Chóp tứ giác đều</button>
    <button class="btn-hinh" onclick="chonMoHinh('lapphuong', this)">Lập phương</button>
    <button class="btn-hinh" onclick="chonMoHinh('non', this)">Khối nón</button>
  </div>

  <model-viewer 
    id="viewer"
    camera-controls 
    touch-action="pan-y" 
    auto-rotate 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    shadow-intensity="1"
    exposure="1.2">
    
    <button slot="ar-button" id="ar-button">
      XEM TRONG KHÔNG GIAN THỰC (AR)
    </button>
  </model-viewer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>

  <script>
    const exporter = new THREE.GLTFExporter();
    const viewer = document.getElementById('viewer');
    const cacMoHinh = {};

    // Bảng màu trực quan cho từng mặt
    const taoVatLieu = (hexColor) => new THREE.MeshStandardMaterial({
      color: hexColor,
      opacity: 0.72,
      transparent: true,
      roughness: 0.2,
      metalness: 0.1,
      side: THREE.DoubleSide
    });

    const matVien = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 });
    const matDiem = new THREE.MeshBasicMaterial({ color: 0xdc2626 });
    const matDuongCao = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });

    function taoDiem(scene, pos) {
      const sp = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), matDiem);
      sp.position.copy(pos);
      scene.add(sp);
    }

    function taoMatTamGiac(p1, p2, p3, mat) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z
      ]), 3));
      geom.computeVertexNormals();
      return new THREE.Mesh(geom, mat);
    }

    function taoMatTuGiac(p1, p2, p3, p4, mat) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        p1.x, p1.y, p1.z,  p2.x, p2.y, p2.z,  p3.x, p3.y, p3.z,
        p1.x, p1.y, p1.z,  p3.x, p3.y, p3.z,  p4.x, p4.y, p4.z
      ]), 3));
      geom.computeVertexNormals();
      return new THREE.Mesh(geom, mat);
    }

    function khoiTaoTatCaHinh() {
      // 1. TỨ DIỆN ĐỀU (4 mặt: Vàng chanh, Xanh dương, Xanh lá, Đỏ cam)
      const scTuDien = new THREE.Scene();
      const vA = new THREE.Vector3(0, 0.816, 0);
      const vB = new THREE.Vector3(0, 0, 0.577);
      const vC = new THREE.Vector3(-0.5, 0, -0.289);
      const vD = new THREE.Vector3(0.5, 0, -0.289);
      const vH = new THREE.Vector3(0, 0, 0);

      scTuDien.add(taoMatTamGiac(vB, vC, vD, taoVatLieu(0xfacc15))); // Đáy BCD: Vàng
      scTuDien.add(taoMatTamGiac(vA, vB, vC, taoVatLieu(0x38bdf8))); // Mặt ABC: Xanh dương
      scTuDien.add(taoMatTamGiac(vA, vC, vD, taoVatLieu(0x4ade80))); // Mặt ACD: Xanh lá
      scTuDien.add(taoMatTamGiac(vA, vD, vB, taoVatLieu(0xf87171))); // Mặt ADB: Đỏ hồng

      // Khung viền 6 cạnh
      const geomTuan = new THREE.BufferGeometry();
      geomTuan.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        vB.x, vB.y, vB.z,  vC.x, vC.y, vC.z,  vD.x, vD.y, vD.z,
        vA.x, vA.y, vA.z,  vB.x, vB.y, vB.z,  vC.x, vC.y, vC.z,
        vA.x, vA.y, vA.z,  vC.x, vC.y, vC.z,  vD.x, vD.y, vD.z,
        vA.x, vA.y, vA.z,  vD.x, vD.y, vD.z,  vB.x, vB.y, vB.z
      ]), 3));
      scTuDien.add(new THREE.LineSegments(new THREE.WireframeGeometry(geomTuan), matVien));
      scTuDien.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([vA, vH]), matDuongCao));
      [vA, vB, vC, vD].forEach(p => taoDiem(scTuDien, p));

      // 2. CHÓP TỨ GIÁC ĐỀU (Đáy vàng + 4 mặt bên 4 màu)
      const scChop = new THREE.Scene();
      const vS = new THREE.Vector3(0, 0.85, 0);
      const vA2 = new THREE.Vector3(-0.4, 0, 0.4);
      const vB2 = new THREE.Vector3(0.4, 0, 0.4);
      const vC2 = new THREE.Vector3(0.4, 0, -0.4);
      const vD2 = new THREE.Vector3(-0.4, 0, -0.4);
      const vO = new THREE.Vector3(0, 0, 0);

      scChop.add(taoMatTuGiac(vA2, vB2, vC2, vD2, taoVatLieu(0xfacc15))); // Đáy ABCD: Vàng
      scChop.add(taoMatTamGiac(vS, vA2, vB2, taoVatLieu(0x38bdf8)));       // SAB: Xanh lam
      scChop.add(taoMatTamGiac(vS, vB2, vC2, taoVatLieu(0x4ade80)));       // SBC: Xanh lá
      scChop.add(taoMatTamGiac(vS, vC2, vD2, taoVatLieu(0xf472b6)));       // SCD: Hồng
      scChop.add(taoMatTamGiac(vS, vD2, vA2, taoVatLieu(0xfb923c)));       // SDA: Cam

      const geomChopKhung = new THREE.BufferGeometry();
      geomChopKhung.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
        vA2.x, vA2.y, vA2.z,  vB2.x, vB2.y, vB2.z,  vC2.x, vC2.y, vC2.z,
        vA2.x, vA2.y, vA2.z,  vC2.x, vC2.y, vC2.z,  vD2.x, vD2.y, vD2.z,
        vS.x, vS.y, vS.z,  vA2.x, vA2.y, vA2.z,  vB2.x, vB2.y, vB2.z,
        vS.x, vS.y, vS.z,  vB2.x, vB2.y, vB2.z,  vC2.x, vC2.y, vC2.z,
        vS.x, vS.y, vS.z,  vC2.x, vC2.y, vC2.z,  vD2.x, vD2.y, vD2.z,
        vS.x, vS.y, vS.z,  vD2.x, vD2.y, vD2.z,  vA2.x, vA2.y, vA2.z
      ]), 3));
      scChop.add(new THREE.LineSegments(new THREE.WireframeGeometry(geomChopKhung), matVien));
      scChop.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([vS, vO]), matDuongCao));
      [vS, vA2, vB2, vC2, vD2].forEach(p => taoDiem(scChop, p));

      // 3. KHỐI LẬP PHƯƠNG (6 mặt 6 màu riêng biệt)
      const scLapPhuong = new THREE.Scene();
      const materialsLapPhuong = [
        taoVatLieu(0xf87171), // Phải (Đỏ)
        taoVatLieu(0x60a5fa), // Trái (Lam)
        taoVatLieu(0x4ade80), // Trên (Xanh lá)
        taoVatLieu(0xfacc15), // Dưới (Vàng)
        taoVatLieu(0xfb923c), // Trước (Cam)
        taoVatLieu(0xc084fc)  // Sau (Tím)
      ];
      const boxGeom = new THREE.BoxGeometry(0.7, 0.7, 0.7);
      boxGeom.translate(0, 0.35, 0);
      scLapPhuong.add(new THREE.Mesh(boxGeom, materialsLapPhuong));
      scLapPhuong.add(new THREE.LineSegments(new THREE.WireframeGeometry(boxGeom), matVien));
      
      const half = 0.35;
      for (let x of [-half, half]) {
        for (let y of [0, 0.7]) {
          for (let z of [-half, half]) {
            taoDiem(scLapPhuong, new THREE.Vector3(x, y, z));
          }
        }
      }

      // 4. KHỐI NÓN (Mặt nón xanh lam, Đáy tròn màu vàng)
      const scNon = new THREE.Scene();
      const coneMat = taoVatLieu(0x38bdf8);
      const coneGeom = new THREE.ConeGeometry(0.45, 0.8, 32, 1, true); // Mở đáy
      coneGeom.translate(0, 0.4, 0);
      scNon.add(new THREE.Mesh(coneGeom, coneMat));
      scNon.add(new THREE.LineSegments(new THREE.WireframeGeometry(coneGeom), matVien));

      // Đáy tròn
      const circleGeom = new THREE.CircleGeometry(0.45, 32);
      circleGeom.rotateX(Math.PI / 2);
      scNon.add(new THREE.Mesh(circleGeom, taoVatLieu(0xfacc15)));

      // Trục nón
      scNon.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0.8, 0), new THREE.Vector3(0, 0, 0)]), matDuongCao));
      taoDiem(scNon, new THREE.Vector3(0, 0.8, 0));

      // Đóng gói mô hình
      const danhSach = [
        { id: 'tudien', scene: scTuDien },
        { id: 'choptugiac', scene: scChop },
        { id: 'lapphuong', scene: scLapPhuong },
        { id: 'non', scene: scNon }
      ];

      danhSach.forEach(item => {
        exporter.parse(item.scene, function (gltf) {
          const blob = new Blob([gltf], { type: 'model/gltf-binary' });
          cacMoHinh[item.id] = URL.createObjectURL(blob);
          if (item.id === 'tudien') {
            viewer.src = cacMoHinh['tudien'];
          }
        }, { binary: true });
      });
    }

    function chonMoHinh(loai, btn) {
      document.querySelectorAll('.btn-hinh').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (cacMoHinh[loai]) {
        viewer.src = cacMoHinh[loai];
      }
    }

    khoiTaoTatCaHinh();
  </script>
</body>
</html>
